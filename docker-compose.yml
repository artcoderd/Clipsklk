services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipeo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipeo}
      POSTGRES_DB: clipeo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipeo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://clipeo:${POSTGRES_PASSWORD:-clipeo}@postgres:5432/clipeo
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    image: clipsklk-worker
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker -Q video --loglevel=info --concurrency=1
    env_file: .env
    environment: *backend-env
    volumes:
      - storage:/data/storage
      - work:/data/work
      - models:/data/models      # Whisper models, downloaded once
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # On the GPU server: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

  # Records live streams (streamlink + ffmpeg stream copy) and detects moments.
  # Light on CPU, no GPU needed; each stream it records is one slot.
  live-worker:
    image: clipsklk-worker          # same image as `worker` (built there)
    pull_policy: never
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker -Q live --loglevel=info --concurrency=4 --prefetch-multiplier=1 -n live@%h
    env_file: .env
    environment: *backend-env
    volumes:
      - storage:/data/storage
      - live:/data/live
      - models:/data/models
    depends_on:
      worker: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Uploads clips to Facebook, Instagram, TikTok and Telegram (network-bound, no GPU).
  publisher:
    image: clipsklk-worker
    pull_policy: never
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker -Q publish --loglevel=info --concurrency=3 --prefetch-multiplier=1 -n publish@%h
    env_file: .env
    environment: *backend-env
    volumes:
      - storage:/data/storage
    depends_on:
      worker: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Every minute: starts the publications whose scheduled time has come.
  scheduler:
    image: clipsklk-worker
    pull_policy: never
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    env_file: .env
    environment: *backend-env
    depends_on:
      worker: { condition: service_started }
      redis: { condition: service_healthy }

  web:
    build:
      context: ./web
      args:
        SITE_URL: ${WEB_URL:-http://localhost:8080}
        SITE_OWNER: ${SITE_OWNER:-}
        SITE_CONTACT: ${SITE_CONTACT:-}
    restart: unless-stopped
    environment:
      API_URL: http://api:8000          # landing page reads the public plans
    depends_on: [api]

  # Daily database backups (see ops/backup/backup.sh and DEPLOY.md).
  backup:
    build: ./ops/backup
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGUSER: clipeo
      PGDATABASE: clipeo
      PGPASSWORD: ${POSTGRES_PASSWORD:-clipeo}
    volumes:
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web, api]

volumes:
  backups:
  live:
  work:
  models:
  pgdata:
  redisdata:
  storage:
  caddydata:
